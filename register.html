<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ANMEC — ลงทะเบียนสินค้า</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">

  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --accent: #1e3a8a;
      --accent-mid: #2563eb;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --success: #16a34a;
      --danger: #dc2626;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    .page {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      padding: 20px 14px 48px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding: 0 2px;
    }

    .back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      min-width: 40px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      font-size: 18px;
    }

    .back-btn:active { background: var(--bg); }

    .header-text h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--accent);
      line-height: 1.1;
    }

    .header-text p {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input, select, textarea {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 18px;
      font-weight: 500;
      font-family: inherit;
      outline: none;
      background: var(--surface);
      color: var(--text);
      transition: border-color 0.12s;
      -webkit-appearance: none;
    }

    input:focus, select:focus { border-color: var(--accent-mid); box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }

    .scan-row { display: flex; gap: 8px; align-items: stretch; }
    .scan-row input { flex: 1; }

    .scan-btn {
      min-width: 52px;
      padding: 0 14px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 10px;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scan-btn:active { background: var(--bg); }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 16px 0;
    }

    .btn-group { display: flex; gap: 8px; margin-top: 18px; }

    button { font-family: inherit; cursor: pointer; }

    .btn {
      flex: 1;
      padding: 14px 10px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 10px;
      border: none;
      letter-spacing: 0.01em;
    }

    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost { background: var(--bg); color: var(--text); border: 1.5px solid var(--border); }

    .status-bar {
      min-height: 22px;
      padding: 10px 0 0;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
    }

    .ok { color: var(--success); }
    .err { color: var(--danger); }

    .tip {
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 9999;
    }

    .modal.open { display: flex; }

    .modal-sheet {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      border-top: 1px solid var(--border);
      overflow: hidden;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px 14px;
      border-bottom: 1px solid var(--border);
    }

    .modal-title { font-size: 17px; font-weight: 800; }

    .close-btn {
      padding: 8px 18px;
      font-size: 15px;
      font-weight: 600;
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: 8px;
    }

    .modal-body { padding: 14px; }

    video {
      width: 100%;
      border-radius: 10px;
      background: #000;
      display: block;
      min-height: 240px;
    }

    .scan-hint { margin-top: 10px; font-size: 14px; color: var(--muted); text-align: center; }
  </style>

  <script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"
    onerror="loadZXingFallback()"></script>
  <script>
    function loadZXingFallback() {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js';
      document.head.appendChild(s);
    }
  </script>
</head>

<body>
  <div class="page">

    <div class="header">
      <a href="index.html" class="back-btn" aria-label="กลับ">←</a>
      <div class="header-text">
        <h1>ลงทะเบียนสินค้า</h1>
        <p>เพิ่มสินค้าใหม่เข้าระบบ</p>
      </div>
    </div>

    <div class="card">
      <div class="card-title">ข้อมูลสินค้า</div>

      <div class="field">
        <label>บาร์โค้ด / QR Code</label>
        <div class="scan-row">
          <input id="barcode" type="text" inputmode="text"
            placeholder="สแกนหรือพิมพ์รหัส" autocomplete="off">
          <button class="scan-btn" type="button" onclick="openScan()" title="เปิดกล้องสแกน">📷</button>
        </div>
      </div>

      <div class="divider"></div>

      <div class="field">
        <label>ชื่อสินค้า</label>
        <input id="pname" type="text" inputmode="text" placeholder="ระบุชื่อสินค้า" autocomplete="off">
      </div>

      <div class="field">
        <label>SKU</label>
        <input id="sku" type="text" inputmode="text" placeholder="รหัส SKU"
          autocomplete="off" style="text-transform:uppercase;">
      </div>

      <div class="field">
        <label>หน่วย</label>
        <select id="unit">
          <option value="">— เลือกหน่วย —</option>
          <option value="ชิ้น">ชิ้น</option>
          <option value="แพ็ค">แพ็ค</option>
          <option value="คู่">คู่</option>
        </select>
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="submitRegister()">บันทึก</button>
        <button class="btn btn-ghost" onclick="clearForm()">ล้าง</button>
      </div>

      <div id="status" class="status-bar"></div>
      <p class="tip">หลังบันทึกสำเร็จ ระบบจะกลับไปหน้าหลักพร้อมโหลดข้อมูลสินค้านี้อัตโนมัติ</p>
    </div>

  </div>

  <div class="modal" id="scanModal" role="dialog" aria-modal="true">
    <div class="modal-sheet">
      <div class="modal-head">
        <div class="modal-title">สแกน QR Code / Barcode</div>
        <button class="close-btn" type="button" onclick="closeScan()">ปิด</button>
      </div>
      <div class="modal-body">
        <video id="scanVideo" playsinline muted></video>
        <div class="scan-hint">รองรับ QR Code, EAN-13 และ Barcode ทั่วไป</div>
      </div>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const ENDPOINT = '/api/stock';

    let zxingControls = null;

    // ---------- Pre-fill from URL ----------

    window.onload = () => {
      const pre = new URLSearchParams(location.search).get('barcode');
      if (pre) $('barcode').value = pre;
      $('pname').focus();
    };

    // ---------- Scanner ----------

    function waitForZXing(ms = 4000) {
      return new Promise((resolve, reject) => {
        if (window.ZXingBrowser) return resolve();
        const deadline = Date.now() + ms;
        const t = setInterval(() => {
          if (window.ZXingBrowser) { clearInterval(t); resolve(); }
          else if (Date.now() > deadline) { clearInterval(t); reject(new Error('โหลด scanner library ไม่ได้')); }
        }, 100);
      });
    }

    async function openScan() {
      $('scanModal').classList.add('open');
      setStatus('กำลังเปิดกล้อง...', '');
      try {
        await waitForZXing();
        const reader = new ZXingBrowser.BrowserMultiFormatReader();
        zxingControls = await reader.decodeFromVideoDevice(
          undefined,
          $('scanVideo'),
          (result, _err, controls) => {
            if (!zxingControls) zxingControls = controls;
            if (!result) return;
            const code = String(result.getText ? result.getText() : (result.text || '')).trim();
            if (!code) return;
            $('barcode').value = code;
            closeScan();
            setStatus('สแกนสำเร็จ ✓', 'ok');
            $('pname').focus();
          }
        );
        setStatus('กำลังสแกน — จ่อกล้องที่รหัส...', '');
      } catch (e) {
        closeScan();
        setStatus('เปิดกล้องไม่ได้: ' + (e?.message || e), 'err');
      }
    }

    function closeScan() {
      $('scanModal').classList.remove('open');
      try { if (typeof zxingControls?.stop === 'function') zxingControls.stop(); } catch (_) {}
      zxingControls = null;
      const v = $('scanVideo');
      try { v.pause(); v.srcObject = null; } catch (_) {}
    }

    document.addEventListener('visibilitychange', () => { if (document.hidden) closeScan(); });
    $('scanModal').addEventListener('click', e => { if (e.target.id === 'scanModal') closeScan(); });

    // ---------- Status ----------

    function setStatus(msg, kind) {
      const el = $('status');
      el.className = 'status-bar' + (kind === 'ok' ? ' ok' : kind === 'err' ? ' err' : '');
      el.textContent = msg || '';
    }

    // ---------- Form ----------

    function clearForm() {
      closeScan();
      ['barcode', 'pname', 'sku'].forEach(id => $(id).value = '');
      $('unit').value = '';
      setStatus('');
      $('barcode').focus();
    }

    async function submitRegister() {
      closeScan();
      const p = {
        fn:      'registerProduct',
        barcode: $('barcode').value.trim(),
        name:    $('pname').value.trim(),
        sku:     $('sku').value.trim().toUpperCase(),
        unit:    $('unit').value,
      };

      if (!p.barcode) return setStatus('กรุณาระบุบาร์โค้ด / QR Code', 'err');
      if (!p.name)    return setStatus('กรุณาระบุชื่อสินค้า', 'err');
      if (!p.sku)     return setStatus('กรุณาระบุ SKU', 'err');
      if (!p.unit)    return setStatus('กรุณาเลือกหน่วย', 'err');

      setStatus('กำลังบันทึก...');
      try {
        const res = await fetch(ENDPOINT, { method: 'POST', body: new URLSearchParams(p) });
        const data = await res.json().catch(() => ({}));
        if (!data.ok) throw new Error(data.error || 'Save failed');
        setStatus('ลงทะเบียนสำเร็จ ✓', 'ok');
        setTimeout(() => {
          window.location.href = 'index.html?barcode=' + encodeURIComponent(p.barcode);
        }, 1200);
      } catch (e) {
        setStatus('Error: ' + (e?.message || e), 'err');
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.target?.tagName !== 'TEXTAREA') submitRegister();
    });
  </script>
</body>
</html>
